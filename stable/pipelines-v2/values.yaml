crd:
  create: false

deployment:
  create: true

rbac:
  create: true

# -------------------------------------------------------------------
# STORAGE (Pipeline Artifacts + Metadata DB Backend)
# -------------------------------------------------------------------
storage:
  artifacts:
    containerName: users
  metadata:
    # mode controls how the MySQL data directory is stored:
    #   v3io - use v3io flexVolume (or volumes.storageOverride if provided)
    #   pvc  - use a Kubernetes PVC (created or existing)
    #   none - use an ephemeral emptyDir (no persistence at all)
    mode: "v3io"
    persistence:
      enabled: false
      existingClaim:
      claimName: mysql-kf-pvc
      storageClass:
      accessMode: "ReadWriteOnce"
      size: "8Gi"
      annotations: ~
    containerName: users
    subPath: /mlpipeline/mysql-kf
    volumes:
      storageOverride: {}

configurations:
  credentials:
    accessKey: overrideMe

  ports:
    nginxPort: 8081

  argo:
    kfpContainerRuntimeExecutor: emissary
    progressDeadlineSeconds: 600
    replicas: 1
    revisionHistoryLimit: 10
    strategy:
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%
    template:
      spec:
        terminationGracePeriodSeconds: 30

  mysql:
    spec:
      template:
        spec:
          containers:
            name: mysql-mysql
            livenessProbe:
              initialDelaySeconds: 10
              failureThreshold: 3
              periodSeconds: 10
            readinessProbe:
              initialDelaySeconds: 20
              failureThreshold: 3
              periodSeconds: 10

  kfpDefaultPipelineRoot:
    objref:
      kind: ConfigMap
      name: pipeline-install-config
      apiVersion: v1
      fieldref:
        fieldpath: data.defaultPipelineRoot

  persistenceagent:
    ttlSecondsAfterWorkflowFinish: 86400
    numWorkers: 2

# -------------------------------------------------------------------
# IMAGES
# -------------------------------------------------------------------
# updated versions can be taken from here: https://github.com/kubeflow/pipelines/blob/master/manifests/kustomize/base/kustomization.yaml
images:
  imagePullPolicy: IfNotPresent

  busybox:
    repository: busybox
    tag: 1.37.0

  argoexec:
    repository: gcr.io/ml-pipeline/argoexec
    tag: v3.4.17-license-compliance

  workflowController:
    repository: gcr.io/ml-pipeline/workflow-controller
    tag: v3.4.17-license-compliance

  apiServer:
    repository: ghcr.io/kubeflow/kfp-api-server
    tag: 2.14.3

  persistenceagent:
    repository: ghcr.io/kubeflow/kfp-persistence-agent
    tag: 2.14.3

  scheduledworkflow:
    repository: ghcr.io/kubeflow/kfp-scheduled-workflow-controller
    tag: 2.14.3

  ui:
    repository: ghcr.io/kubeflow/kfp-frontend
    tag: 2.14.3

  viewerCrdController:
    repository: ghcr.io/kubeflow/kfp-viewer-crd-controller
    tag: 2.14.3

  visualizationServer:
    repository: ghcr.io/kubeflow/kfp-visualization-server
    tag: 2.14.3

  metadata:
    container:
      repository: gcr.io/tfx-oss-public/ml_metadata_store_server
      tag: 1.16.0
    init:
      repository: imega/mysql-client
      tag: 10.6.4

  metadataEnvoy:
    repository: ghcr.io/kubeflow/kfp-metadata-envoy
    tag: 2.14.3

  metadataWriter:
    repository: ghcr.io/kubeflow/kfp-metadata-writer
    tag: 2.14.3

  mysqlLegacy:
    repository: gcr.io/iguazio/mysql-legacy
    tag: 5.6

  mysql:
    repository: gcr.io/iguazio/mysql
    tag: 8.4

resources:
  workflowController: {}
  metadata: {}
  metadataWriter: {}
  metadataEnvoy: {}
  apiServer: {}
  persistenceAgent: {}
  scheduledWorkflow: {}
  ui: {}
  viewerCRD: {}
  visualizationServer: {}
  mysql: {}

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

# -------------------------------------------------------------------
# Artifact store backend selector:
#   kind: v3io | minio
# -------------------------------------------------------------------
storageMode:
  kind: v3io        # default; set to "minio" to switch

  minio:
    serviceHost: minio.{{ .Release.Namespace }}.svc
    servicePort: 9000
    defaultBucket: mlrun
    accessKey: console
    secretKey: console123

# -------------------------------------------------------------------
# MySQL pod
# -------------------------------------------------------------------
db:

  # contains the secret name for the mysql credentials in a format of
  # stringData:
  #    username: "kubeflow"
  #    password: "{{ $password }}"
  #    mysql.cnf: |
  #      [client]
  #      user=kubeflow
  #      password={{ $password }}
  existingSecretName: ""

  podSecurityContext:
    runAsUser: 1001

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
  # runAsNonRoot: true

  dumpRestore:
    enabled: true   # enable to dump data from KFP 1.8 MySQL 5.6 to KFP 2.X MySQL version 8.4

managedstorage:
  enabled: false
  gcsBucketName: ""
