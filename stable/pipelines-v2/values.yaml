crd:
  create: false

deployment:
  create: true

rbac:
  create: true

global:
  imagePullSecrets: []

# -------------------------------------------------------------------
# STORAGE (Pipeline Artifacts + Metadata DB Backend)
# -------------------------------------------------------------------
storage:
  artifacts:
    containerName: users
  metadata:
    # mode controls how the MySQL data directory is stored:
    #   v3io - use v3io flexVolume (or volumes.storageOverride if provided)
    #   pvc  - use a Kubernetes PVC (created or existing)
    #   none - use an ephemeral emptyDir (no persistence at all)
    mode: "v3io"
    persistence:
      enabled: false
      existingClaim:
      claimName: mysql-kf-pvc
      storageClass:
      accessMode: "ReadWriteOnce"
      size: "8Gi"
      annotations: ~
    containerName: users
    subPath: /mlpipeline/mysql-kf
    volumes:
      storageOverride: {}

configurations:
  credentials:
    accessKey: overrideMe

  ports:
    nginxPort: 8081

  ui:
    replicas: 1

  argo:
    kfpContainerRuntimeExecutor: emissary
    progressDeadlineSeconds: 600
    replicas: 1
    revisionHistoryLimit: 10
    strategy:
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%
    template:
      spec:
        terminationGracePeriodSeconds: 30

  mysql:
    spec:
      template:
        spec:
          containers:
            name: mysql-mysql
            livenessProbe:
              initialDelaySeconds: 10
              failureThreshold: 3
              periodSeconds: 10
            readinessProbe:
              initialDelaySeconds: 20
              failureThreshold: 3
              periodSeconds: 10

  kfpDefaultPipelineRoot:
    objref:
      kind: ConfigMap
      name: pipeline-install-config
      apiVersion: v1
      fieldref:
        fieldpath: data.defaultPipelineRoot

  # KFP Launcher object store provider configuration
  # https://www.kubeflow.org/docs/components/pipelines/operator-guides/configure-object-store/#kfp-launcher-object-store-configuration
  # providers:
  #   s3:
  #     default:
  #       endpoint: s3.amazonaws.com
  #       disableSSL: false
  #       region: us-east-2
  #       forcePathStyle: true
  #       credentials:
  #         fromEnv: true
  persistenceagent:
    ttlSecondsAfterWorkflowFinish: 86400
    numWorkers: 2

# -------------------------------------------------------------------
# IMAGES
# -------------------------------------------------------------------
# updated versions can be taken from here: https://github.com/kubeflow/pipelines/blob/master/manifests/kustomize/base/kustomization.yaml
images:
  imagePullPolicy: IfNotPresent

  busybox:
    repository: busybox
    tag: 1.37.0

  argoexec:
    repository: quay.io/argoproj/argoexec
    tag: v3.7.11

  workflowController:
    repository: quay.io/argoproj/workflow-controller
    tag: v3.7.11

  apiServer:
    repository: ghcr.io/kubeflow/kfp-api-server
    tag: 2.16.0

  persistenceagent:
    repository: ghcr.io/kubeflow/kfp-persistence-agent
    tag: 2.16.0

  scheduledworkflow:
    repository: ghcr.io/kubeflow/kfp-scheduled-workflow-controller
    tag: 2.16.0

  ui:
    repository: ghcr.io/kubeflow/kfp-frontend
    tag: 2.16.0

  viewerCrdController:
    repository: ghcr.io/kubeflow/kfp-viewer-crd-controller
    tag: 2.16.0

  visualizationServer:
    repository: ghcr.io/kubeflow/kfp-visualization-server
    tag: 2.16.0

  metadata:
    container:
      repository: gcr.io/tfx-oss-public/ml_metadata_store_server
      tag: 1.17.1
    init:
      repository: imega/mysql-client
      tag: 10.6.4

  metadataEnvoy:
    repository: ghcr.io/kubeflow/kfp-metadata-envoy
    tag: 2.16.0

  metadataWriter:
    repository: ghcr.io/kubeflow/kfp-metadata-writer
    tag: 2.16.0

  mysqlLegacy:
    repository: gcr.io/iguazio/mysql-legacy
    tag: 5.6

  mysql:
    repository: gcr.io/iguazio/mysql
    tag: 8.4

resources:
  workflowController: {}
  metadata: {}
  metadataWriter: {}
  metadataEnvoy: {}
  apiServer: {}
  persistenceAgent: {}
  scheduledWorkflow: {}
  ui: {}
  viewerCRD: {}
  visualizationServer: {}
  mysql: {}

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

# -------------------------------------------------------------------
# Artifact store backend selector:
#   kind: v3io | minio
# -------------------------------------------------------------------
storageMode:
  # default; set to "minio" to switch
  kind: v3io
  useTLS: false
  minio:
    serviceHost: minio.{{ .Release.Namespace }}.svc
    servicePort: 9000
    defaultBucket: mlrun
    accessKey: console
    secretKey: console123
    insecure: "true"
    keyPrefix: mlpipeline

    # uncomment to use an existing secret
    # existingSecretName: ""

    # field names for the secret
    accessKeyName: accesskey
    secretKeyName: secretkey

# -------------------------------------------------------------------
# MySQL pod
# -------------------------------------------------------------------
db:

  # contains the secret name for the mysql credentials in a format of
  # stringData:
  #    username: "kubeflow"
  #    password: "{{ $password }}"
  #    mysql.cnf: |
  #      [client]
  #      user=kubeflow
  #      password={{ $password }}
  existingSecretName: ""

  podSecurityContext:
    runAsUser: 1001
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    seccompProfile:
      type: RuntimeDefault

  dumpRestore:
    enabled: true   # enable to dump data from KFP 1.8 MySQL 5.6 to KFP 2.X MySQL version 8.4

  dbConfiguration:
    innodb:
      extraFlags: {} # extra flags to pass to the mysql server start command, example:
      # extraFlags:
      #   innodb-use-native-aio: 0
      # will be passed as --innodb-use-native-aio=0

managedstorage:
  enabled: false
  gcsBucketName: ""

# -------------------------------------------------------------------
# SECURITY CONTEXTS
# -------------------------------------------------------------------
securityContext:
  # -- Standard pod-level context shared by most deployments
  defaultPod:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  # -- Standard container-level context shared by most containers
  defaultContainer:
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 0
    capabilities:
      drop:
        - ALL

  # -- Argo workflow controller
  workflowController:
    pod:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    container:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    # Executor context (embedded in configmap)
    executor:
      runAsNonRoot: true
      runAsUser: 65532
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

  # -- Metadata gRPC server
  metadataGrpc:
    initMysqlCnf:
      runAsUser: 65534
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    metadataInit:
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 0
      capabilities:
        drop:
          - ALL
    metadataContainer:
      runAsUser: 65534
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

  # -- Metadata writer
  metadataWriter:
    container:
      runAsUser: 65534
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
