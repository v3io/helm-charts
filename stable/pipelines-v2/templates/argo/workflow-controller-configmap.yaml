{{- if .Values.rbac.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-controller-configmap
  labels:
    component: workflow-controller
{{ include "pipelines.commonLabels" . | indent 4 }}
{{- if eq .Values.storageMode.kind "minio" }}
data:                      # "config: |" key is optional in 2.7+!
  instanceID: my-ci-controller
  metricsConfig: |
    enabled: false
    path: /metrics
    port: 9090
    ignoreErrors: false
  artifactRepository: |    # However, all nested maps must be strings
    archiveLogs: true
    s3:
      endpoint: {{ .Values.storageMode.minio.serviceHost }}:{{ .Values.storageMode.minio.servicePort }}
      bucket: {{ .Values.storageMode.minio.defaultBucket }}
      insecure: true
      accessKeySecret:
        name: mlpipeline-minio-artifact
        key: accesskey
      secretKeySecret:
        name: mlpipeline-minio-artifact
        key: secretkey

{{- else if eq .Values.storageMode.kind "v3io" }}
data:
  # emissary executor is a more portable default, see https://github.com/kubeflow/kfp/issues/1654.
  #  containerRuntimeExecutor: emissary

  config: |
    {
      namespace: {{ .Release.Namespace }},
      artifactRepository:
      {
          s3: {
              bucket: {{ .Values.storage.artifacts.containerName }},
              keyPrefix: mlpipeline,
              endpoint: v3io-webapi.{{ .Release.Namespace }}:{{ .Values.configurations.ports.nginxPort }},
              insecure: true,
              accessKeySecret: {
                  name: v3io-webapi-secret,
                  key: accesskey
              },
              secretKeySecret: {
                  name: v3io-webapi-secret,
                  key: secretkey
              }
          },
          archiveLogs: true
      }
    }
{{- end }}
{{- end }}
