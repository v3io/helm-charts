{{- if .Values.rbac.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-controller-configmap
  labels:
    component: workflow-controller
{{ include "pipelines.commonLabels" . | indent 4 }}
{{- if eq .Values.storageMode.kind "minio" }}
data:
  metricsConfig: |
    enabled: false
    path: /metrics
    port: 9090
    ignoreErrors: false
  artifactRepository: |
    archiveLogs: true
    s3:
      endpoint: {{ .Values.storageMode.minio.serviceHost }}:{{ .Values.storageMode.minio.servicePort }}
      bucket: {{ .Values.storageMode.minio.defaultBucket }}
      insecure: {{ .Values.storageMode.minio.insecure }}
      accessKeySecret:
        name: {{ include "pipelines.minioStorageSecretName" . }}
        key: {{ include "pipelines.minioAccessKeyName" . }}
      secretKeySecret:
        name: {{ include "pipelines.minioStorageSecretName" . }}
        key: {{ include "pipelines.minioSecretKeyName" . }}

{{- else if eq .Values.storageMode.kind "v3io" }}
data:
  config: |
    {
      namespace: {{ .Release.Namespace }},
      artifactRepository:
      {
          s3: {
              bucket: {{ .Values.storage.artifacts.containerName }},
              keyPrefix: mlpipeline,
              endpoint: v3io-webapi.{{ .Release.Namespace }}:{{ .Values.configurations.ports.nginxPort }},
              insecure: {{ .Values.storageMode.minio.insecure }},
              accessKeySecret: {
                  name: v3io-webapi-secret,
                  key: accesskey
              },
              secretKeySecret: {
                  name: v3io-webapi-secret,
                  key: secretkey
              }
          },
          archiveLogs: true
      }
    }
{{- end }}
{{- end }}
