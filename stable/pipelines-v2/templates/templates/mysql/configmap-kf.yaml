{{- if .Values.rbac.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: mysql-kf
  labels:
    component: mysql-kf
{{ include "pipelines.commonLabels" . | indent 4 }}
data:
  create_user.sql: |
    DROP USER IF EXISTS '${DB_USER}'@'%';
    CREATE USER IF NOT EXISTS '${DB_USER}'@'%' IDENTIFIED WITH mysql_native_password BY '${MYSQL_PWD}';
    GRANT ALL PRIVILEGES ON *.* TO '${DB_USER}'@'%';
    FLUSH PRIVILEGES;

  dump-or-skip.sh: |
    #!/usr/bin/env bash
    set -xeuo pipefail

    : "${DB_USER:?DB_USER must be set}"
    : "${MYSQL_PWD:?MYSQL_PWD must be set}"

    readonly DATA_DIR="/var/lib/mysql"
    readonly DUMP_FILE="/dump/pre_upgrade_dump.sql"
    readonly LOG_FILE="/tmp/mysql_log"
    readonly LOCK_FILE="${DATA_DIR}/.lock_upgrade_mysql_8.0.26"

    if [[ -f "${LOCK_FILE}" ]]; then
      echo "Already dumped; skipping."
      exit 0
    fi

    if [[ ! -d "${DATA_DIR}/mlpipeline" ]]; then
      echo "No existing mlpipeline data; skipping dump."
      touch "${LOCK_FILE}"
      exit 0
    fi
    echo "Dumping mlpipeline schema..."
    mysqld --skip-grant-tables \
           --datadir="${DATA_DIR}" \
           --log-error="${LOG_FILE}" &
    OLD_PID=$!

    until mysqladmin -u root ping; do
      sleep 1
    done

    mysqldump -u root mlpipeline > "${DUMP_FILE}"

    mysqladmin -u root shutdown
    wait "${OLD_PID}"

    echo "Dump complete; file at ${DUMP_FILE}."

  import-if-dump-done.sh: |
    #!/usr/bin/env bash
    set -xeuo pipefail

    : "${DB_USER:?DB_USER must be set}"
    : "${MYSQL_PWD:?MYSQL_PWD must be set}"

    readonly DATA_DIR="/var/lib/mysql"
    readonly DUMP_FILE="/dump/pre_upgrade_dump.sql"
    readonly LOCK_FILE="${DATA_DIR}/.lock_upgrade_mysql_8.0.26"
    readonly INIT_SCRIPT="/etc/config/mysql/init-scripts/create_user.sql"

    if [[ -f "${DATA_DIR}/.lock_upgrade_mysql_8.0.26" ]]; then
      echo "Already imported; skipping."
      exit 0
    fi

    if [[ ! -f "${DUMP_FILE}" ]]; then
      echo "Dump file not found at ${DUMP_FILE}; skipping import."
      exit 0
    fi

    rm -rf "${DATA_DIR}"/*
    mysqld --initialize \
           --datadir="${DATA_DIR}" \
           --init-file="${INIT_SCRIPT}"

    mysqld --datadir="${DATA_DIR}" --init-file="${INIT_SCRIPT}" &
    NEW_PID=$!

    until mysqladmin --defaults-extra-file=/mysql.cnf ping; do
      sleep 1
    done

    mysql -u"${DB_USER}" < "${DUMP_FILE}"
    mysqladmin --defaults-extra-file=/mysql.cnf shutdown
    wait "${NEW_PID}"
    echo "Import complete."

  start-mysql.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    : "${DB_USER:?Environment variable DB_USER must be set.}"
    : "${MYSQL_PWD:?Environment variable MYSQL_PWD must be set.}"

    readonly RAW_INIT_SCRIPT="/etc/config/mysql/init-scripts/create_user.sql"
    readonly INIT_SCRIPT="/tmp/create_user.sql"
    readonly DATA_DIR="/var/lib/mysql"

    sed -e "s|\${DB_USER}|${DB_USER}|g" \
        -e "s|\${MYSQL_PWD}|${MYSQL_PWD}|g" \
        "${RAW_INIT_SCRIPT}" > "${INIT_SCRIPT}"

    MYSQLD_OPTS=(
      --default-authentication-plugin=mysql_native_password
      --datadir="${DATA_DIR}"
      --init-file="${INIT_SCRIPT}"
      --disable-log-bin
    )

    if [[ ! -d "${DATA_DIR}/mysql" ]]; then
      echo "Data directory not found. Initializing MySQL..."
      MYSQLD_OPTS=(--initialize "${MYSQLD_OPTS[@]}")
    else
      echo "Starting existing MySQL instance..."
    fi

    exec mysqld "${MYSQLD_OPTS[@]}"
{{- end }}
