{{- if .Values.rbac.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: mysql-kf
  labels:
    component: mysql-kf
{{ include "pipelines.commonLabels" . | indent 4 }}
data:
  create_user.sql: |
    DROP USER IF EXISTS '${DB_USER}'@'%';
    CREATE USER IF NOT EXISTS '${DB_USER}'@'%' IDENTIFIED WITH mysql_native_password BY '${MYSQL_PWD}';
    GRANT ALL PRIVILEGES ON *.* TO '${DB_USER}'@'%';
    FLUSH PRIVILEGES;

  dump-or-skip.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    readonly BASE_DIR="/var/lib/mysql"
    readonly DATA_DIR="${BASE_DIR}/data"
    readonly DUMP_FILE_BASE_NAME="${BASE_DIR}/dump/pre_upgrade_dump"
    readonly META_DUMP_FILE="${DUMP_FILE_BASE_NAME}_metadb.sql"
    readonly PIPELINE_DUMP_FILE="${DUMP_FILE_BASE_NAME}_mlpipeline.sql"
    readonly LOG_FILE="/tmp/mysql_log"
    readonly LOCK_FILE="${BASE_DIR}/.lock_dump_mysql_5.6"

    # Skip if we've already dumped or both dump files already exist
    if [[ -f "${LOCK_FILE}" || ( -f "${META_DUMP_FILE}" && -f "${PIPELINE_DUMP_FILE}" ) ]]; then
      echo "Already dumped; skipping."
      exit 0
    fi

    if [[ ! -d "${BASE_DIR}/mlpipeline" ]]; then
      echo "No existing mlpipeline data; skipping dump."
      touch "${LOCK_FILE}"
      exit 0
    fi

    echo "Dumping metadb and mlpipeline databases..."
    mysqld --skip-grant-tables \
           --datadir="${BASE_DIR}" \
           --log-error="${LOG_FILE}" &
    OLD_PID=$!

    until mysqladmin -u root ping; do
      sleep 1
    done

    mkdir -p "${BASE_DIR}/dump"
    mysqldump -u root metadb     > "${META_DUMP_FILE}"
    mysqldump -u root mlpipeline > "${PIPELINE_DUMP_FILE}"

    mysqladmin -u root shutdown
    wait "${OLD_PID}"

    touch "${LOCK_FILE}"
    echo "Dump complete; files at ${META_DUMP_FILE}, ${PIPELINE_DUMP_FILE}."

  import-if-dump-done.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    : "${DB_USER:?DB_USER must be set}"
    : "${MYSQL_PWD:?MYSQL_PWD must be set}"

    readonly BASE_DIR="/var/lib/mysql"
    readonly DATA_DIR="${BASE_DIR}/data"
    readonly DUMP_FILE_BASE_NAME="${BASE_DIR}/dump/pre_upgrade_dump"
    readonly META_DUMP_FILE="${DUMP_FILE_BASE_NAME}_metadb.sql"
    readonly PIPELINE_DUMP_FILE="${DUMP_FILE_BASE_NAME}_mlpipeline.sql"
    readonly LOCK_FILE="${BASE_DIR}/.lock_restore_mysql_5.6_to_8.4"
    readonly SOCKET="/var/run/mysqld/mysqld.sock"
    readonly SECRET_FILE="/run/secrets/mysql/mysql.cnf"
    readonly RAW_INIT_SCRIPT="/etc/config/mysql/init-scripts/create_user.sql"
    readonly INIT_SCRIPT="/tmp/create_user.sql"

    if [[ -f "${LOCK_FILE}" ]]; then
      echo "Already imported; skipping."
      exit 0
    fi

    # Require both dump files to proceed
    if [[ ! -f "${META_DUMP_FILE}" || ! -f "${PIPELINE_DUMP_FILE}" ]]; then
      echo "Required dump files missing; expected:"
      echo "  ${META_DUMP_FILE}"
      echo "  ${PIPELINE_DUMP_FILE}"
      echo "Skipping import."
      exit 0
    fi

    sed -e "s|\${DB_USER}|${DB_USER}|g" \
        -e "s|\${MYSQL_PWD}|${MYSQL_PWD}|g" \
        "${RAW_INIT_SCRIPT}" > "${INIT_SCRIPT}"

    rm -rf "${DATA_DIR}"
    mkdir -p "${DATA_DIR}"

    MYSQLD_OPTS=(
      --mysql-native-password=ON
      --skip-log-bin
      --datadir="${DATA_DIR}"
      --socket="${SOCKET}"
      --init-file="${INIT_SCRIPT}"

    )
    mysqld "${MYSQLD_OPTS[@]}" --initialize-insecure
    echo "Initialized MySQL data directory."

    mysqld "${MYSQLD_OPTS[@]}" &
    NEW_PID=$!

    mysql_exec() {
      mysql --defaults-extra-file="${SECRET_FILE}" --socket "${SOCKET}" --execute="$1"
    }

    until mysqladmin --defaults-extra-file="${SECRET_FILE}" --socket "${SOCKET}" ping; do
      sleep 1
    done
    mysql_exec "CREATE DATABASE IF NOT EXISTS metadb;"
    mysql_exec "CREATE DATABASE IF NOT EXISTS mlpipeline;"

    mysql_exec "SET PERSIST innodb_stats_auto_recalc = 0;"
    mysql_exec "SET PERSIST innodb_lock_wait_timeout = 120;"
    mysql_exec "ALTER INSTANCE DISABLE INNODB REDO_LOG;"
    echo "Importing metadb database from ${META_DUMP_FILE}..."
    mysql --defaults-extra-file="${SECRET_FILE}" --socket "${SOCKET}" metadb < ${META_DUMP_FILE}
    echo "Importing mlpipeline database from ${PIPELINE_DUMP_FILE}..."
    mysql --defaults-extra-file="${SECRET_FILE}" --socket "${SOCKET}" mlpipeline < ${PIPELINE_DUMP_FILE}
    mysql_exec "ALTER INSTANCE ENABLE INNODB REDO_LOG;"

    mysqladmin --defaults-extra-file="${SECRET_FILE}" --socket "${SOCKET}" shutdown
    wait "${NEW_PID}"
    touch ${LOCK_FILE}
    echo "Import complete."
  fix-kfp-indices.sql: |
    -- This script adds missing indexes and makes some existing indexes invisible to
    -- improve performance of common queries in Kubeflow Pipelines 2.5 on MySQL 8.4.
    -- Run details index
    SET @idx_exists = (
    SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS
    WHERE TABLE_SCHEMA = DATABASE()
    AND TABLE_NAME = 'run_details'
    AND INDEX_NAME = 'run_details_experiment_created_uuid_desc'
    );
    SET @sql = IF(@idx_exists = 0,
    'CREATE INDEX run_details_experiment_created_uuid_desc ON run_details (ExperimentUUID, CreatedAtInSec DESC, UUID DESC);',
    'SELECT "Index run_details_experiment_created_uuid_desc already exists";'
    );
    PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;

    -- resource_references index
    SET @idx_exists = (
    SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS
    WHERE TABLE_SCHEMA = DATABASE()
    AND TABLE_NAME = 'resource_references'
    AND INDEX_NAME = 'rr_type_uuid_payload'
    );
    SET @sql = IF(@idx_exists = 0,
    'CREATE INDEX rr_type_uuid_payload ON resource_references (ResourceType, ResourceUUID, Payload(255));',
    'SELECT "Index rr_type_uuid_payload already exists";'
    );
    PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;

    -- tasks index
    SET @idx_exists = (
    SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS
    WHERE TABLE_SCHEMA = DATABASE()
    AND TABLE_NAME = 'tasks'
    AND INDEX_NAME = 'tasks_runuuid_payload'
    );
    SET @sql = IF(@idx_exists = 0,
    'CREATE INDEX tasks_runuuid_payload ON tasks (RunUUID, Payload(255));',
    'SELECT "Index tasks_runuuid_payload already exists";'
    );
    PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;

    -- run_metrics index
    SET @idx_exists = (
    SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS
    WHERE TABLE_SCHEMA = DATABASE()
    AND TABLE_NAME = 'run_metrics'
    AND INDEX_NAME = 'run_metrics_runuuid_payload'
    );
    SET @sql = IF(@idx_exists = 0,
    'CREATE INDEX run_metrics_runuuid_payload ON run_metrics (RunUUID, Payload(255));',
    'SELECT "Index run_metrics_runuuid_payload already exists";'
    );
    PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;

    -- Make specific indexes invisible (no error if they don't exist)
    ALTER TABLE run_details ALTER INDEX experimentuuid_createatinsec INVISIBLE;
    ALTER TABLE run_details ALTER INDEX idx_created_desc INVISIBLE;
    ALTER TABLE run_details ALTER INDEX idx_run_details_created_uuid_asc INVISIBLE;

    -- Refresh statistics
    ANALYZE TABLE run_details;


  start-mysql.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    : "${DB_USER:?Environment variable DB_USER must be set.}"
    : "${MYSQL_PWD:?Environment variable MYSQL_PWD must be set.}"

    readonly RAW_INIT_SCRIPT="/etc/config/mysql/init-scripts/create_user.sql"
    readonly FIX_INDICES_SCRIPT="/etc/config/mysql/init-scripts/fix-kfp-indices.sql"
    readonly INIT_SCRIPT="/tmp/create_user.sql"
    readonly BASE_DIR="/var/lib/mysql"
    readonly DATA_DIR="${BASE_DIR}/data"
    readonly SOCKET="/var/run/mysqld/mysqld.sock"

    sed -e "s|\${DB_USER}|${DB_USER}|g" \
        -e "s|\${MYSQL_PWD}|${MYSQL_PWD}|g" \
        "${RAW_INIT_SCRIPT}" > "${INIT_SCRIPT}"

    cat "${FIX_INDICES_SCRIPT}" >> "${INIT_SCRIPT}"

    MYSQLD_OPTS=(
      --mysql-native-password=ON
      --skip-log-bin
      --datadir="${DATA_DIR}"
      --socket="${SOCKET}"
      --init-file="${INIT_SCRIPT}"
    )

    if [[ ! -d "${DATA_DIR}/mysql" ]]; then
      mkdir -p "${DATA_DIR}"
      mysqld --initialize-insecure --datadir="${DATA_DIR}"
    fi

    exec mysqld "${MYSQLD_OPTS[@]}"

{{- end }}
