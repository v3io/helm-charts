{{- if .Values.rbac.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: mysql-kf
  labels:
    component: mysql-kf
{{ include "pipelines.commonLabels" . | indent 4 }}
data:
  create_user.sql: |
    DROP USER IF EXISTS '${DB_USER}'@'%';
    CREATE USER IF NOT EXISTS '${DB_USER}'@'%' IDENTIFIED WITH mysql_native_password BY '${MYSQL_PWD}';
    GRANT ALL PRIVILEGES ON *.* TO '${DB_USER}'@'%';
    FLUSH PRIVILEGES;

  dump-or-skip.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    readonly BASE_DIR="/var/lib/mysql"
    readonly DATA_DIR="${BASE_DIR}/data"
    readonly DUMP_FILE="${BASE_DIR}/dump/pre_upgrade_dump.sql"
    readonly LOG_FILE="/tmp/mysql_log"
    readonly LOCK_FILE="${BASE_DIR}/.lock_dump_mysql_5.6"

    if [[ -f "${LOCK_FILE}" || -f ${DUMP_FILE} ]]; then
      echo "Already dumped; skipping."
      exit 0
    fi

    if [[ ! -d "${BASE_DIR}/mlpipeline" ]]; then
      echo "No existing mlpipeline data; skipping dump."
      touch "${LOCK_FILE}"
      exit 0
    fi
    echo "Dumping mlpipeline database..."
    mysqld --skip-grant-tables \
           --datadir="${BASE_DIR}" \
           --log-error="${LOG_FILE}" &
    OLD_PID=$!

    until mysqladmin -u root ping; do
      sleep 1
    done
    mkdir -p "${BASE_DIR}/dump"
    mysqldump -u root mlpipeline > "${DUMP_FILE}"

    mysqladmin -u root shutdown
    wait "${OLD_PID}"

    touch "${LOCK_FILE}"
    echo "Dump complete; file at ${DUMP_FILE}."

  import-if-dump-done.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    : "${DB_USER:?DB_USER must be set}"
    : "${MYSQL_PWD:?MYSQL_PWD must be set}"

    readonly BASE_DIR="/var/lib/mysql"
    readonly DATA_DIR="${BASE_DIR}/data"
    readonly DUMP_FILE="${BASE_DIR}/dump/pre_upgrade_dump.sql"
    readonly LOCK_FILE="${BASE_DIR}/.lock_restore_mysql_5.6_to_8.4"
    readonly SOCKET="/var/run/mysqld/mysqld.sock"
    readonly SECRET_FILE="/run/secrets/mysql/mysql.cnf"
    readonly RAW_INIT_SCRIPT="/etc/config/mysql/init-scripts/create_user.sql"
    readonly INIT_SCRIPT="/tmp/create_user.sql"

    if [[ -f "${LOCK_FILE}" ]]; then
      echo "Already imported; skipping."
      exit 0
    fi

    if [[ ! -f "${DUMP_FILE}" ]]; then
      echo "Dump file not found at ${DUMP_FILE}; skipping import."
      exit 0
    fi

    sed -e "s|\${DB_USER}|${DB_USER}|g" \
        -e "s|\${MYSQL_PWD}|${MYSQL_PWD}|g" \
        "${RAW_INIT_SCRIPT}" > "${INIT_SCRIPT}"

    rm -rf "${DATA_DIR}"
    mkdir -p "${DATA_DIR}"

    MYSQLD_OPTS=(
      --mysql-native-password=ON
      --skip-log-bin
      --datadir="${DATA_DIR}"
      --socket="${SOCKET}"
      --init-file="${INIT_SCRIPT}"

    )
    mysqld "${MYSQLD_OPTS[@]}" --initialize-insecure
    echo "Initialized MySQL data directory."

    mysqld "${MYSQLD_OPTS[@]}" &
    NEW_PID=$!

    until mysqladmin --defaults-extra-file="${SECRET_FILE}" --socket "${SOCKET}" ping; do
      sleep 1
    done
    mysql \
      --defaults-extra-file="${SECRET_FILE}" \
      --socket "${SOCKET}" \
      --execute="CREATE DATABASE IF NOT EXISTS mlpipeline;"

    mysql --defaults-extra-file="${SECRET_FILE}" --socket "${SOCKET}" mlpipeline < "${DUMP_FILE}"
    mysqladmin --defaults-extra-file="${SECRET_FILE}" --socket "${SOCKET}" shutdown
    wait "${NEW_PID}"
    touch ${LOCK_FILE}
    echo "Import complete."

  start-mysql.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    : "${DB_USER:?Environment variable DB_USER must be set.}"
    : "${MYSQL_PWD:?Environment variable MYSQL_PWD must be set.}"

    readonly RAW_INIT_SCRIPT="/etc/config/mysql/init-scripts/create_user.sql"
    readonly INIT_SCRIPT="/tmp/create_user.sql"
    readonly BASE_DIR="/var/lib/mysql"
    readonly DATA_DIR="${BASE_DIR}/data"
    readonly SOCKET="/var/run/mysqld/mysqld.sock"

    sed -e "s|\${DB_USER}|${DB_USER}|g" \
        -e "s|\${MYSQL_PWD}|${MYSQL_PWD}|g" \
        "${RAW_INIT_SCRIPT}" > "${INIT_SCRIPT}"

    MYSQLD_OPTS=(
      --mysql-native-password=ON
      --skip-log-bin
      --datadir="${DATA_DIR}"
      --socket="${SOCKET}"
      --init-file="${INIT_SCRIPT}"
    )

    if [[ ! -d "${DATA_DIR}/mysql" ]]; then
      mkdir -p "${DATA_DIR}"
      mysqld --initialize-insecure --datadir="${DATA_DIR}"
    fi

    exec mysqld "${MYSQLD_OPTS[@]}"

{{- end }}
