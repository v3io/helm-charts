{{- if .Values.deployment.create }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-envoy-deployment
  labels:
    component: metadata-envoy
{{ include "pipelines.commonLabels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      component: metadata-envoy
  template:
    metadata:
      labels:
        component: metadata-envoy
{{ include "pipelines.commonLabels" . | indent 8 }}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
{{- include "pipelines.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.securityContext.defaultPod | nindent 8 }}
      containers:
      - name: container
        image: {{ .Values.images.metadataEnvoy.repository }}:{{ .Values.images.metadataEnvoy.tag }}
        imagePullPolicy: {{ .Values.images.imagePullPolicy }}
        args: ["/etc/envoy/envoy-config.yaml"]
        ports:
        - name: md-envoy
          containerPort: 9090
        - name: envoy-admin
          containerPort: 9901
        securityContext:
          {{- toYaml .Values.securityContext.defaultContainer | nindent 10 }}
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
        resources:
{{ toYaml .Values.resources.metadataEnvoy | indent 10 }}
      volumes:
      - name: envoy-config
        configMap:
          name: metadata-envoy-configmap
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
{{- end }}
{{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
{{- end }}
{{- end }}
