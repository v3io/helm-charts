{{- if eq .Values.storageMode.kind "minio" }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  labels:
    app: pipelines
  name: mlpipeline-minio-artifact
  namespace: {{ .Release.Namespace }}
data:
  accesskey: {{ .Values.storageMode.minio.accessKey | b64enc }}
  secretkey: {{ .Values.storageMode.minio.secretKey | b64enc }}
{{- end -}}
