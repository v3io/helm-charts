{{- if .Values.deployment.create }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    component: ml-pipeline
{{ include "pipelines.commonLabels" . | indent 4 }}
  name: ml-pipeline
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      component: ml-pipeline
{{ include "pipelines.commonLabels" . | indent 6 }}
  template:
    metadata:
      labels:
        component: ml-pipeline
{{ include "pipelines.commonLabels" . | indent 8 }}
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      containers:
      - name: ml-pipeline-api-server
        env:
        - name: LOG_LEVEL
          value: "info"
        # Driver / launcher log level during pipeline execution
        - name: PIPELINE_LOG_LEVEL
          value: "1"
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: OBJECTSTORECONFIG_SECURE
          value: "false"
        {{- if .Values.storageMode.kind.v3io.enabled }}
        - name: OBJECTSTORECONFIG_ACCESSKEY
          value: "{{ .Values.configurations.credentials.accessKey }}"
        - name: OBJECTSTORECONFIG_SECRETACCESSKEY
          value: minio123
        - name: OBJECTSTORECONFIG_BUCKETNAME
          value: "{{ .Values.storage.artifacts.containerName }}"
        - name: DBCONFIG_USER
          valueFrom:
            secretKeyRef:
              name: mysql-kf-secret
              key: username
        - name: DBCONFIG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-kf-secret
              key: password
        - name: DBCONFIG_MYSQLCONFIG_USER
          valueFrom:
            secretKeyRef:
              name: mysql-kf-secret
              key: username
        - name: DBCONFIG_MYSQLCONFIG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-kf-secret
              key: password
        - name: DBCONFIG_MYSQLCONFIG_HOST
          value: mysql-kf

        # end of MySQL Config
        - name: OBJECTSTORECONFIG_PORT
          value: "{{ .Values.configurations.ports.nginxPort }}"
        - name: OBJECTSTORECONFIG_HOST
          value: v3io-webapi
        {{- end }}
        {{- if .Values.storageMode.kind.minio.enabled }}
        - name: OBJECTSTORECONFIG_ACCESSKEY
          valueFrom:
            secretKeyRef:
              name: mlpipeline-minio-artifact
              key: accesskey
        - name: OBJECTSTORECONFIG_SECRETACCESSKEY
          valueFrom:
            secretKeyRef:
              name: mlpipeline-minio-artifact
              key: secretkey
        - name: OBJECTSTORECONFIG_BUCKETNAME
          valueFrom:
            configMapKeyRef:
              name: pipeline-install-config
              key: minioDefaultBucket
        - name: OBJECTSTORECONFIG_PORT
          valueFrom:
            configMapKeyRef:
              name: pipeline-install-config
              key: minioServicePort
        - name: OBJECTSTORECONFIG_HOST
          valueFrom:
            configMapKeyRef:
              name: pipeline-install-config
              key: minioServiceHost
        {{- end }}
        - name: OBJECTSTORECONFIG_MULTIPART_DISABLE
          value: "true"
        - name: OBJECTSTORECONFIG_FORCEV2SIGNATURE
          value: "true"
        - name: AUTO_UPDATE_PIPELINE_DEFAULT_VERSION
          value: "false"
        image: {{ .Values.images.apiServer.repository }}:{{ .Values.images.apiServer.tag }}
        imagePullPolicy: {{ .Values.images.imagePullPolicy }}
        ports:
        - name: http
          containerPort: 8888
        - name: grpc
          containerPort: 8887
        readinessProbe:
          exec:
            command:
              - wget
              - -q # quiet
              - -S # show server response
              - -O
              - "-" # Redirect output to stdout
              - http://localhost:8888/apis/v1beta1/healthz
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          exec:
            command:
              - wget
              - -q # quiet
              - -S # show server response
              - -O
              - "-" # Redirect output to stdout
              - http://localhost:8888/apis/v1beta1/healthz
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        # This startup probe provides up to a 60 second grace window before the
        # liveness probe takes over to accomodate the occasional database
        # migration.
        startupProbe:
          exec:
            command:
              - wget
              - -q # quiet
              - -S # show server response
              - -O
              - "-" # Redirect output to stdout
              - http://localhost:8888/apis/v1beta1/healthz
          failureThreshold: 12
          periodSeconds: 5
          timeoutSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 0
          capabilities:
            drop:
            - ALL
        resources:
{{ toYaml .Values.resources.apiServer | indent 12 }}
      serviceAccountName: ml-pipeline
      {{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      {{- else }}
      nodeSelector: {}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      {{- else }}
      tolerations: []
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
      {{- else }}
      affinity: {}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
{{- end }}
