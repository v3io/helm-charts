{{- if .Values.rbac.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: mysql-kf
  labels:
    component: mysql-kf
{{ include "pipelines.commonLabels" . | indent 4 }}
data:

  health_check.sh: |
    mysqladmin status

  init-v3io-mysql.sh: |
    #!/usr/bin/env bash
    set -e

    echo "Current user -> $(whoami)"
    LOCK_FILE=/var/lib/mysql/.init-complete
    if [ -f $LOCK_FILE ]
    then
      echo "MySQL has already been initialized. Skipping..."
    else
      echo "Initializing MySQL..."
      rm /var/lib/mysql/ib_logfile*

      mysqld --initialize --user=mysql --datadir=/tmp/mysql
      # and then copy the init files into real working directory (on Fuse mount)
      cp -R /tmp/mysql /var/lib/
      touch $LOCK_FILE
    fi


  start-mysql.sh: |
    #!/usr/bin/env bash
    set -e

    echo "Current user -> $(whoami)"

    INIT_SCRIPT="/etc/config/mysql/init-scripts/create_user.sql"

    echo "Starting MySQL ..."

    mysqld \
      --user={{- include "pipelines.db.DBRunUser" . }} \
      --default-authentication-plugin=mysql_native_password \
      --disable-log-bin \
      --init-file=$INIT_SCRIPT

{{- end }}
