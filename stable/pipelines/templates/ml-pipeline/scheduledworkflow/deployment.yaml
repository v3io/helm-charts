{{- if .Values.deployment.create }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-pipeline-scheduledworkflow
  namespace: {{ .Release.Namespace }}
  labels:
    component: ml-pipeline-scheduledworkflow
{{ include "pipelines.commonLabels" . | indent 4 }}
spec:
  selector:
    matchLabels:
      component: ml-pipeline-scheduledworkflow
{{ include "pipelines.commonLabels" . | indent 6 }}
  template:
    metadata:
      labels:
        component: ml-pipeline-scheduledworkflow
{{ include "pipelines.commonLabels" . | indent 8 }}
    spec:
      containers:
      - image: {{ .Values.images.scheduledworkflow.repository }}:{{ .Values.images.scheduledworkflow.tag }}
        imagePullPolicy: {{ .Values.images.imagePullPolicy }}
        name: ml-pipeline-scheduledworkflow
        env:
          - name: LOG_LEVEL
            value: "info"
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
{{/*          - name: CRON_SCHEDULE_TIMEZONE*/}}
{{/*            valueFrom:*/}}
{{/*              configMapKeyRef:*/}}
{{/*                name: pipeline-install-config*/}}
{{/*                key: cronScheduleTimezone*/}}
        resources:
{{ toYaml .Values.resources.scheduledWorkflow | indent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 0
          capabilities:
            drop:
            - ALL
        volumeMounts:
          - mountPath: /var/run/secrets/kubeflow/tokens
            name: scheduledworkflow-sa-token
      serviceAccountName: ml-pipeline-scheduledworkflow
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
{{- end }}
{{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
{{- end }}
{{- end }}
      volumes:
        - name: scheduledworkflow-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: scheduledworkflow-sa-token
                  expirationSeconds: 3600
                  audience: pipelines.kubeflow.org