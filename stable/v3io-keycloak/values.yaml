global:
  security:
    allowInsecureImages: true

keycloak:
  fullnameOverride: v3io-keycloak
  image:
    registry: gcr.io
    repository: iguazio/keycloak
    tag: 26.3.3-debian-11-r6
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP

  auth:
   adminUser: iguazio
   createSecret: false
   existingSecret: v3io-keycloak-master-creds
   passwordSecretKey: masterPassword

  postgresql:
    enabled: false

  # A first-time install must run Keycloak's entire historical Liquibase changelog
  # from scratch, which can take longer than livenessProbe's default 120s window on a
  # loaded system - if that probe kills the container mid-migration, MySQL's
  # non-transactional DDL leaves the schema permanently wedged (see IG-25046).
  # A startupProbe defers liveness/readiness checks until Keycloak's HTTP port is
  # actually up, so a slow first migration is never mistaken for a hung container.
  startupProbe:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60 # ~10 minutes for the first-time migration to complete
    successThreshold: 1

  # Per Bitnami's own guidance: once startupProbe is enabled, liveness/readiness
  # should not add their own extra initial delay on top of it.
  livenessProbe:
    initialDelaySeconds: 0

  readinessProbe:
    initialDelaySeconds: 0

  externalDatabase:
    host: v3io-keycloak-db
    port: 3306
    user: keycloak-admin
    database: keycloak
    schema: keycloak

    # if you change this value, be sure to change the value in v3io-mysql.adminSecret.name as well
    existingSecret: v3io-keycloak-db-creds

  extraEnvVarsCM: v3io-keycloak-extra-env-vars

  createRealmsSecret: true
  realmsSecret: v3io-keycloak-realms
  extraVolumes: |
    - name: realms
      secret:
        secretName: {{ .Values.realmsSecret }}

  extraVolumeMounts:
    - name: realms
      mountPath: /realm_config
      readOnly: true

  initContainerImage: alpine:3.17
  initContainers: |
    - name: wait-for-mysql
      image: {{ .Values.initContainerImage }}
      imagePullPolicy: IfNotPresent
      command: ['sh', '-c']
      args:
        - echo -e "Waiting MySQL Server deployment availability";
          while ! nc -z {{ .Values.externalDatabase.host }} {{ .Values.externalDatabase.port | quote }}; do
            sleep 1;
            echo "MySQL Server not available yet";
          done;
          echo -e "MySQL Server has started";

  # This is the content of the realms.json file in the v3io-keycloak-realms configmap.
  # The realms.json can contain a single json for a single realm or a list of jsons for multiple realms.
  # Example for multiple realms:
  # realmsConfig: |
  #   [
  #     {
  #       "id": "realm1",
  #       "realm": "realm1",
  #       "enabled": true,
  #       "displayName": "Realm 1",
  #       "displayNameHtml": "First Realm"
  #     },
  #     {
  #       "id": "realm2",
  #       "realm": "realm2",
  #       "enabled": true,
  #       "displayName": "Realm 2",
  #       "displayNameHtml": "Second Realm"
  #     }
  #   ]
  realmsConfig: "{}"

v3io-mysql:
  fullnameOverride: v3io-keycloak-db
  createDatabase: keycloak

  adminSecret:
    create: false
    name: v3io-keycloak-db-creds

  persistence:
    v3io:
      mountPath: keycloak/mysql

  service:
    port: 3306
