{{- if .Values.vault.enabled }}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ template "provazio.vault.name" . }}
  labels:
    app: {{ template "provazio.name" . }}
    chart: {{ template "provazio.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    component: vault
  {{- with .Values.vault.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

{{- end }}
